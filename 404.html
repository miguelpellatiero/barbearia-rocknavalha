<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>Página não encontrada | Rock &amp; Navalha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Work+Sans:wght@400;500;700&display=swap">
  <style>
    :root{color-scheme:dark;--white:#f4f4f4;--gray:#8c8c8c;--line:rgba(255,255,255,.24);box-sizing:border-box}
    *,*::before,*::after{box-sizing:inherit}
    html{min-height:100%;background:#000}
    body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#171717 0,#080808 42%,#000 76%);color:var(--white);font:400 16px/1.6 "Work Sans",system-ui,sans-serif;text-align:center}
    body::before{position:fixed;inset:0;content:"";pointer-events:none;opacity:.3;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.035) 4px)}
    main{position:relative;width:min(100%,620px);padding:clamp(32px,8vw,64px) clamp(22px,7vw,56px);border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035);box-shadow:0 24px 100px #000, inset 0 1px rgba(255,255,255,.12);animation:arrive .8s cubic-bezier(.2,.7,.2,1) both}
    .brand{margin:0 0 34px;font:700 14px/1.4 Cinzel,Georgia,serif;letter-spacing:.28em;text-transform:uppercase;color:#c8c8c8}
    .mark{position:relative;width:38px;height:38px;margin:0 auto 25px;border:2px solid #aaa;border-radius:50%;overflow:hidden;box-shadow:0 0 28px rgba(255,255,255,.14);animation:turn 8s linear infinite}
    .mark::before{position:absolute;inset:-12px;content:"";background:repeating-linear-gradient(45deg,#f4f4f4 0 7px,#424242 7px 14px)}
    .mark::after{position:absolute;inset:0;content:"";border-inline:4px solid #080808;border-radius:50%}
    .eyebrow{margin:0 0 8px;color:var(--gray);font-size:12px;font-weight:700;letter-spacing:.32em;text-transform:uppercase}
    h1{margin:0;font:700 clamp(88px,22vw,150px)/.95 Cinzel,Georgia,serif;letter-spacing:.03em;text-shadow:0 0 36px rgba(255,255,255,.12)}
    .rule{width:min(100%,300px);height:3px;margin:24px auto 28px;background:linear-gradient(90deg,transparent,#aaa 20%,#fff 50%,#aaa 80%,transparent)}
    h2{margin:0 0 12px;font:700 clamp(22px,5vw,30px)/1.2 Cinzel,Georgia,serif;letter-spacing:.04em}
    .message{max-width:390px;margin:0 auto 30px;color:#b5b5b5}
    .home{display:inline-flex;min-height:50px;align-items:center;justify-content:center;gap:12px;padding:12px 24px;border:1px solid #fff;border-radius:999px;background:#f4f4f4;color:#000;font-weight:700;text-decoration:none;transition:transform .2s,box-shadow .2s}
    .home:hover{transform:translateY(-2px);box-shadow:0 0 28px rgba(255,255,255,.25)}
    .home:focus-visible{outline:3px solid #aaa;outline-offset:4px}
    .home span{font-size:20px;line-height:1}
    .foot{margin:28px 0 0;color:#686868;font-size:12px;letter-spacing:.08em}
    @keyframes arrive{from{opacity:0;transform:translateY(24px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
    @keyframes turn{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main>
    <p class="brand">Rock &amp; Navalha</p>
    <div class="mark" aria-hidden="true"></div>
    <p class="eyebrow">Página não encontrada</p>
    <h1>404</h1>
    <div class="rule" aria-hidden="true"></div>
    <h2>Essa página saiu do corte.</h2>
    <p class="message">O endereço pode estar errado ou a página foi movida. Volte para o início e encontre o que procura.</p>
    <a class="home" href="/barbearia-rocknavalha/"><span aria-hidden="true">←</span> Voltar para o início</a>
    <p class="foot">BARBEARIA · SÃO JOSÉ DOS CAMPOS, SP</p>
  </main>
</body>
</html>
